<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Clutter Auditor</title>
<style>
  :root{
    --ink:#12161d;
    --board:#171e28;
    --col-bg:#1c2431;
    --col-header:#222c3b;
    --col-border:#2c3646;
    --paper:#f2ede0;
    --paper-edge:#e4dcc8;
    --text-dark:#22252a;
    --text-dim:#6b6656;
    --text-light:#dbe2ea;
    --text-light-dim:#8993a4;
    --accent:#4fb3a8;
    --accent-dim:#33685f;
    --amber:#e0a458;

    --p-urgent:#c8534d;
    --p-urgent-bg:#f6ded9;
    --p-recurring:#4a7fc9;
    --p-recurring-bg:#dde7f6;
    --p-quick:#c98f2e;
    --p-quick-bg:#f4e6cb;
    --p-lp:#7c8797;
    --p-lp-bg:#e4e6ea;
    --p-none:#a9a294;
    --p-none-bg:#f2ede0;

    --mono: 'SFMono-Regular', ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text-light);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---------- Header / Input ---------- */
  header{
    flex:0 0 auto;
    border-bottom:1px solid var(--col-border);
    background:var(--board);
    padding:14px 20px 12px;
  }
  .header-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    margin-bottom:10px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.12em;
    color:var(--accent);
    background:rgba(79,179,168,.12);
    border:1px solid var(--accent-dim);
    padding:3px 7px;
    border-radius:3px;
  }
  .brand h1{
    font-size:16px;
    font-weight:600;
    margin:0;
    letter-spacing:.01em;
  }
  .brand p{
    margin:0;
    font-size:11.5px;
    color:var(--text-light-dim);
  }
  .header-actions{
    display:flex;
    gap:8px;
  }

  .input-row{
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  textarea#raw-input{
    flex:1;
    resize:vertical;
    min-height:64px;
    max-height:220px;
    background:#0f141b;
    border:1px solid var(--col-border);
    border-radius:5px;
    color:var(--text-light);
    font-family:var(--mono);
    font-size:12.5px;
    line-height:1.5;
    padding:10px 12px;
  }
  textarea#raw-input::placeholder{ color:#4c5566; }
  textarea#raw-input:focus{ outline:none; border-color:var(--accent-dim); }

  .input-actions{
    display:flex;
    flex-direction:column;
    gap:6px;
    min-width:118px;
  }

  button{
    font-family:var(--sans);
    cursor:pointer;
    border:none;
  }
  .btn{
    font-size:12px;
    font-weight:600;
    padding:8px 12px;
    border-radius:5px;
    background:var(--col-header);
    color:var(--text-light);
    border:1px solid var(--col-border);
    transition:background .12s ease, border-color .12s ease;
    white-space:nowrap;
  }
  .btn:hover{ background:#2a3546; border-color:#3a4658; }
  .btn-primary{
    background:var(--accent);
    color:#0e1a18;
    border-color:var(--accent);
  }
  .btn-primary:hover{ background:#5cc2b6; }
  .btn-ghost{
    background:transparent;
    color:var(--text-light-dim);
    border:1px solid var(--col-border);
  }
  .btn-ghost:hover{ color:var(--text-light); border-color:#3a4658; }
  .btn-danger-ghost{
    background:transparent;
    color:#d98a86;
    border:1px solid #4a3230;
  }
  .btn-danger-ghost:hover{ background:rgba(200,83,77,.12); }

  .autosave-note{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--text-light-dim);
    margin-top:6px;
    min-height:14px;
  }

  /* ---------- Board ---------- */
  #board{
    flex:1;
    display:flex;
    overflow-x:auto;
    overflow-y:hidden;
    padding:16px 20px;
    gap:14px;
    background:var(--board);
  }
  #board::-webkit-scrollbar{ height:10px; }
  #board::-webkit-scrollbar-thumb{ background:#2c3646; border-radius:6px; }
  #board::-webkit-scrollbar-track{ background:transparent; }

  .column{
    flex:0 0 272px;
    display:flex;
    flex-direction:column;
    background:var(--col-bg);
    border:1px solid var(--col-border);
    border-radius:7px;
    max-height:100%;
  }
  .column.unsorted-col{
    border-style:dashed;
    opacity:.96;
  }
  .column-header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    background:var(--col-header);
    border-bottom:1px solid var(--col-border);
    border-radius:7px 7px 0 0;
  }
  .column-header .title{
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.01em;
    color:var(--text-light);
  }
  .column-header .sub{
    display:block;
    font-family:var(--mono);
    font-size:9.5px;
    font-weight:400;
    color:var(--text-light-dim);
    margin-top:1px;
    letter-spacing:.03em;
  }
  .column-header .count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-light-dim);
    background:rgba(255,255,255,.05);
    border:1px solid var(--col-border);
    padding:2px 7px;
    border-radius:20px;
    min-width:20px;
    text-align:center;
  }

  .column-drop{
    flex:1;
    overflow-y:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .column-drop::-webkit-scrollbar{ width:8px; }
  .column-drop::-webkit-scrollbar-thumb{ background:#2c3646; border-radius:6px; }

  .column-drop.drag-over{
    background:rgba(79,179,168,.06);
    outline:1px dashed var(--accent-dim);
    outline-offset:-4px;
  }
  .empty-hint{
    font-size:11.5px;
    color:var(--text-light-dim);
    text-align:center;
    padding:14px 6px;
    font-style:italic;
  }

  /* insertion marker for reordering */
  .drop-marker{
    height:2px;
    background:var(--accent);
    border-radius:2px;
    margin:0 2px;
    flex:0 0 auto;
  }

  /* ---------- Card ---------- */
  .card{
    position:relative;
    background:var(--paper);
    color:var(--text-dark);
    border-radius:4px;
    border:1px solid var(--paper-edge);
    padding:9px 10px 8px 14px;
    box-shadow:0 1px 2px rgba(0,0,0,.25);
    cursor:grab;
    font-size:12.5px;
    line-height:1.42;
  }
  .card::before{
    content:"";
    position:absolute;
    left:0; top:4px; bottom:4px;
    width:4px;
    border-radius:2px;
    background:var(--p-none);
  }
  .card[data-priority="urgent"]::before{ background:var(--p-urgent); }
  .card[data-priority="recurring"]::before{ background:var(--p-recurring); }
  .card[data-priority="quick"]::before{ background:var(--p-quick); }
  .card[data-priority="lp"]::before{ background:var(--p-lp); }

  .card.dragging{ opacity:.35; }
  .card.done{ opacity:.55; }
  .card.done .card-text{ text-decoration:line-through; }

  .card-id{
    font-family:var(--mono);
    font-size:9px;
    color:var(--text-dim);
    letter-spacing:.03em;
    margin-bottom:3px;
  }

  .card-text{
    outline:none;
    font-weight:600;
    color:var(--text-dark);
    word-break:break-word;
    min-height:16px;
  }
  .card-text:focus{
    background:#fffdf6;
    box-shadow:0 0 0 1px var(--accent-dim);
    border-radius:2px;
  }

  .card-notes{
    margin-top:6px;
    padding-left:0;
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .card-notes li{
    display:flex;
    align-items:flex-start;
    gap:5px;
    font-size:11.5px;
    color:#454138;
  }
  .card-notes li::before{
    content:"·";
    color:var(--text-dim);
    font-weight:700;
    margin-top:-1px;
  }
  .card-note-text{
    outline:none;
    flex:1;
    word-break:break-word;
  }
  .card-note-text:focus{
    background:#fffdf6;
    box-shadow:0 0 0 1px var(--accent-dim);
    border-radius:2px;
  }
  .note-remove{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:12px;
    line-height:1;
    padding:0 2px;
    opacity:0;
    transition:opacity .1s;
  }
  .card-notes li:hover .note-remove{ opacity:1; }
  .note-remove:hover{ color:var(--p-urgent); }

  .add-detail{
    margin-top:5px;
    background:none;
    border:none;
    font-size:10.5px;
    color:var(--text-dim);
    padding:0;
    font-weight:600;
  }
  .add-detail:hover{ color:var(--accent-dim); text-decoration:underline; }

  .card-meta-row{
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:8px;
    flex-wrap:wrap;
  }

  .priority-pill{
    font-family:var(--mono);
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:3px 7px;
    border-radius:20px;
    background:var(--p-none-bg);
    color:var(--p-none);
    border:1px solid transparent;
  }
  .card[data-priority="urgent"] .priority-pill{ background:var(--p-urgent-bg); color:var(--p-urgent); }
  .card[data-priority="recurring"] .priority-pill{ background:var(--p-recurring-bg); color:var(--p-recurring); }
  .card[data-priority="quick"] .priority-pill{ background:var(--p-quick-bg); color:var(--p-quick); }
  .card[data-priority="lp"] .priority-pill{ background:var(--p-lp-bg); color:var(--p-lp); }
  .priority-pill:hover{ filter:brightness(0.95); }

  .subbranch-input{
    font-family:var(--sans);
    font-size:10.5px;
    color:var(--text-dark);
    background:transparent;
    border:none;
    border-bottom:1px dashed var(--paper-edge);
    padding:2px 1px;
    width:78px;
    min-width:50px;
  }
  .subbranch-input::placeholder{ color:var(--text-dim); font-style:italic; }
  .subbranch-input:focus{ outline:none; border-bottom-color:var(--accent-dim); }

  .icon-btn{
    background:none;
    border:none;
    font-size:12.5px;
    color:var(--text-dim);
    padding:2px 3px;
    border-radius:3px;
    line-height:1;
  }
  .icon-btn:hover{ background:rgba(0,0,0,.06); }
  .icon-btn.active{ color:var(--amber); }
  .icon-btn.done-toggle.active{ color:var(--accent-dim); }
  .icon-btn.delete-btn{ margin-left:auto; color:var(--text-dim); }
  .icon-btn.delete-btn.armed{
    color:#fff;
    background:var(--p-urgent);
    font-family:var(--mono);
    font-size:9px;
    font-weight:700;
    padding:3px 6px;
    letter-spacing:.03em;
  }
  .icon-btn.delete-btn.armed:hover{ background:#b34540; }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;
    bottom:16px;
    left:50%;
    transform:translateX(-50%) translateY(8px);
    background:#222c3b;
    color:var(--text-light);
    font-size:12px;
    padding:8px 16px;
    border-radius:20px;
    border:1px solid var(--col-border);
    opacity:0;
    pointer-events:none;
    transition:opacity .15s, transform .15s;
    z-index:50;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width: 720px){
    .input-row{ flex-direction:column; }
    .input-actions{ flex-direction:row; min-width:0; width:100%; }
    .input-actions .btn{ flex:1; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="brand">
      <span class="mark">TCA</span>
      <div>
        <h1>Task Clutter Auditor</h1>
        <p>Paste your notes → parse → triage into branches</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" id="reset-input-btn">Clear input</button>
      <button class="btn btn-danger-ghost" id="reset-board-btn">Reset board</button>
    </div>
  </div>

  <div class="input-row">
    <textarea id="raw-input" placeholder="Paste raw notes here. Start tasks with -, details with *, separate distinct thoughts with ---), flag urgent with ! before the dash. Plain lines (no symbol) are treated as labels and skipped."></textarea>
    <div class="input-actions">
      <button class="btn btn-primary" id="parse-btn">Parse notes</button>
      <div class="autosave-note" id="autosave-note"></div>
    </div>
  </div>
</header>

<div id="board"></div>
<div id="toast"></div>

<script>
(function(){
  'use strict';

  /* ---------------- Config ---------------- */
  var COLUMNS = [
    { id: 'inbox',       label: 'Inbox',              sub: 'reviewed · ready to file' },
    { id: 'mkp',         label: 'MKP' },
    { id: 'super-admin', label: 'Super Admin' },
    { id: 'crm-ops',     label: 'CRM & Operations' },
    { id: 'jtg-admin',   label: 'JTG Admin' },
    { id: 'mambay-co',   label: 'Mambay Co' },
    { id: 'unywebs',     label: 'Unywebs' },
    { id: 'unsorted',    label: '? Unsorted',         sub: 'needs review / not ready to toss', extraClass: 'unsorted-col' }
  ];

  var PRIORITY_ORDER = ['none', 'urgent', 'recurring', 'quick', 'lp'];
  var PRIORITY_LABEL = { none: 'None', urgent: 'Urgent / HP', recurring: 'Recurring', quick: 'Quick', lp: 'LP' };

  var STORAGE_KEY = 'tca-board-state-v1';
  var AUTOSAVE_DEBOUNCE = 400;

  /* ---------------- State ---------------- */
  var state = {
    cards: {}       // id -> card object (column stored on card)
  };

  var idCounter = 0;
  function makeId(){
    idCounter += 1;
    return 'c' + Date.now().toString(36) + idCounter.toString(36);
  }

  function newCard(text, column){
    return {
      id: makeId(),
      text: text || '',
      notes: [],
      priority: 'none',
      subBranch: '',
      needsDetail: false,
      done: false,
      column: column,
      order: Date.now() + Math.random()
    };
  }

  /* ---------------- Persistence ---------------- */
  var saveTimer = null;
  function scheduleSave(){
    clearTimeout(saveTimer);
    var note = document.getElementById('autosave-note');
    note.textContent = 'saving…';
    saveTimer = setTimeout(function(){
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        note.textContent = 'saved ' + new Date().toLocaleTimeString();
      }catch(e){
        note.textContent = 'autosave failed (storage unavailable)';
      }
    }, AUTOSAVE_DEBOUNCE);
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && parsed.cards) state = parsed;
      }
    }catch(e){ /* ignore corrupt storage */ }
  }

  /* ---------------- Parser ---------------- */
  function parseRawText(raw){
    var newCards = [];
    var chunks = raw.split('---)');

    chunks.forEach(function(chunk){
      var currentCard = null;
      var lines = chunk.split('\n');

      lines.forEach(function(line){
        var trimmed = line.trim();
        if(trimmed === '') return; // skip empty lines

        var isUrgent = false;
        var rest = trimmed;

        if(rest.charAt(0) === '!'){
          isUrgent = true;
          rest = rest.slice(1).trim();
        }

        if(rest.charAt(0) === '-'){
          var taskText = rest.slice(1).trim();
          var card = newCard(taskText, 'inbox');
          if(isUrgent) card.priority = 'urgent';
          newCards.push(card);
          currentCard = card;
        } else if(rest.charAt(0) === '*'){
          var noteText = rest.slice(1).trim();
          if(currentCard){
            currentCard.notes.push(noteText);
          } else {
            // no preceding card in this chunk -> standalone card, routed to Unsorted
            var orphan = newCard(noteText, 'unsorted');
            newCards.push(orphan);
            currentCard = orphan;
          }
        } else {
          // plain line: treated as a section/label only, not a card. skipped.
        }
      });
    });

    return newCards;
  }

  /* ---------------- Rendering ---------------- */
  var boardEl = document.getElementById('board');

  function cardsForColumn(colId){
    return Object.keys(state.cards)
      .map(function(k){ return state.cards[k]; })
      .filter(function(c){ return c.column === colId; })
      .sort(function(a,b){ return a.order - b.order; });
  }

  function renderBoard(){
    boardEl.innerHTML = '';
    COLUMNS.forEach(function(col){
      boardEl.appendChild(renderColumn(col));
    });
  }

  function renderColumn(col){
    var wrap = document.createElement('div');
    wrap.className = 'column' + (col.extraClass ? ' ' + col.extraClass : '');
    wrap.dataset.column = col.id;

    var header = document.createElement('div');
    header.className = 'column-header';
    var titleWrap = document.createElement('div');
    var title = document.createElement('div');
    title.className = 'title';
    title.textContent = col.label;
    titleWrap.appendChild(title);
    if(col.sub){
      var sub = document.createElement('span');
      sub.className = 'sub';
      sub.textContent = col.sub;
      titleWrap.appendChild(sub);
    }
    var count = document.createElement('div');
    count.className = 'count';
    var cards = cardsForColumn(col.id);
    count.textContent = cards.length;
    header.appendChild(titleWrap);
    header.appendChild(count);
    wrap.appendChild(header);

    var drop = document.createElement('div');
    drop.className = 'column-drop';
    drop.dataset.column = col.id;

    if(cards.length === 0){
      var hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.textContent = col.id === 'unsorted' ? 'Nothing parked here.' : 'Drop cards here.';
      drop.appendChild(hint);
    } else {
      cards.forEach(function(card){
        drop.appendChild(renderCard(card));
      });
    }

    attachColumnDnD(drop);
    wrap.appendChild(drop);
    return wrap;
  }

  function renderCard(card){
    var el = document.createElement('div');
    el.className = 'card' + (card.done ? ' done' : '');
    el.dataset.priority = card.priority;
    el.dataset.id = card.id;
    el.draggable = true;

    var idTag = document.createElement('div');
    idTag.className = 'card-id';
    idTag.textContent = '#' + card.id.slice(-5);
    el.appendChild(idTag);

    var text = document.createElement('div');
    text.className = 'card-text';
    text.contentEditable = 'true';
    text.textContent = card.text;
    text.addEventListener('input', function(){
      card.text = text.textContent;
      scheduleSave();
    });
    text.addEventListener('dragstart', function(e){ e.preventDefault(); e.stopPropagation(); });
    el.appendChild(text);

    if(card.notes.length){
      var notesEl = document.createElement('ul');
      notesEl.className = 'card-notes';
      card.notes.forEach(function(noteText, idx){
        notesEl.appendChild(renderNoteLine(card, idx, noteText));
      });
      el.appendChild(notesEl);
    }

    var addDetail = document.createElement('button');
    addDetail.className = 'add-detail';
    addDetail.textContent = '+ add detail';
    addDetail.addEventListener('click', function(){
      card.notes.push('');
      scheduleSave();
      renderBoard();
      var sel = document.querySelector('.card[data-id="'+card.id+'"] .card-notes li:last-child .card-note-text');
      if(sel){ sel.focus(); }
    });
    el.appendChild(addDetail);

    var meta = document.createElement('div');
    meta.className = 'card-meta-row';

    var pill = document.createElement('button');
    pill.className = 'priority-pill';
    pill.textContent = PRIORITY_LABEL[card.priority];
    pill.title = 'Click to cycle priority';
    pill.addEventListener('click', function(){
      var idx = PRIORITY_ORDER.indexOf(card.priority);
      card.priority = PRIORITY_ORDER[(idx + 1) % PRIORITY_ORDER.length];
      scheduleSave();
      renderBoard();
    });
    meta.appendChild(pill);

    var subInput = document.createElement('input');
    subInput.className = 'subbranch-input';
    subInput.type = 'text';
    subInput.placeholder = 'sub-branch';
    subInput.value = card.subBranch || '';
    subInput.addEventListener('input', function(){
      card.subBranch = subInput.value;
      scheduleSave();
    });
    subInput.addEventListener('mousedown', function(e){ e.stopPropagation(); });
    meta.appendChild(subInput);

    var needsDetailBtn = document.createElement('button');
    needsDetailBtn.className = 'icon-btn needs-detail-toggle' + (card.needsDetail ? ' active' : '');
    needsDetailBtn.textContent = '⚑';
    needsDetailBtn.title = card.needsDetail ? 'Marked: needs more detail' : 'Mark: needs more detail';
    needsDetailBtn.addEventListener('click', function(){
      card.needsDetail = !card.needsDetail;
      scheduleSave();
      renderBoard();
    });
    meta.appendChild(needsDetailBtn);

    var doneBtn = document.createElement('button');
    doneBtn.className = 'icon-btn done-toggle' + (card.done ? ' active' : '');
    doneBtn.textContent = card.done ? '✓' : '○';
    doneBtn.title = card.done ? 'Mark not done' : 'Mark done';
    doneBtn.addEventListener('click', function(){
      card.done = !card.done;
      scheduleSave();
      renderBoard();
    });
    meta.appendChild(doneBtn);

    var delBtn = document.createElement('button');
    delBtn.className = 'icon-btn delete-btn';
    delBtn.textContent = '✕';
    delBtn.title = 'Delete card';
    var armed = false;
    var disarmTimer = null;
    delBtn.addEventListener('click', function(e){
      e.stopPropagation();
      if(!armed){
        armed = true;
        delBtn.classList.add('armed');
        delBtn.textContent = 'Confirm?';
        disarmTimer = setTimeout(function(){
          armed = false;
          delBtn.classList.remove('armed');
          delBtn.textContent = '✕';
        }, 2800);
      } else {
        clearTimeout(disarmTimer);
        delete state.cards[card.id];
        scheduleSave();
        renderBoard();
        showToast('Card deleted');
      }
    });
    meta.appendChild(delBtn);

    el.appendChild(meta);

    attachCardDrag(el, card);

    return el;
  }

  function renderNoteLine(card, idx, noteText){
    var li = document.createElement('li');
    var span = document.createElement('span');
    span.className = 'card-note-text';
    span.contentEditable = 'true';
    span.textContent = noteText;
    span.addEventListener('input', function(){
      card.notes[idx] = span.textContent;
      scheduleSave();
    });
    span.addEventListener('dragstart', function(e){ e.preventDefault(); e.stopPropagation(); });
    li.appendChild(span);

    var rm = document.createElement('button');
    rm.className = 'note-remove';
    rm.textContent = '×';
    rm.title = 'Remove detail';
    rm.addEventListener('click', function(){
      card.notes.splice(idx, 1);
      scheduleSave();
      renderBoard();
    });
    li.appendChild(rm);

    return li;
  }

  /* ---------------- Drag & Drop ---------------- */
  var draggedId = null;

  function attachCardDrag(el, card){
    el.addEventListener('dragstart', function(e){
      draggedId = card.id;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', card.id); }catch(err){}
    });
    el.addEventListener('dragend', function(){
      el.classList.remove('dragging');
      draggedId = null;
      clearMarkers();
    });
  }

  function clearMarkers(){
    document.querySelectorAll('.drop-marker').forEach(function(m){ m.remove(); });
    document.querySelectorAll('.column-drop.drag-over').forEach(function(d){ d.classList.remove('drag-over'); });
  }

  function attachColumnDnD(dropEl){
    dropEl.addEventListener('dragover', function(e){
      if(!draggedId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      dropEl.classList.add('drag-over');

      // remove existing markers within this column
      Array.prototype.forEach.call(dropEl.querySelectorAll('.drop-marker'), function(m){ m.remove(); });

      var afterEl = getCardAfterY(dropEl, e.clientY);
      var marker = document.createElement('div');
      marker.className = 'drop-marker';
      if(afterEl){
        dropEl.insertBefore(marker, afterEl);
      } else {
        dropEl.appendChild(marker);
      }
    });

    dropEl.addEventListener('dragleave', function(e){
      if(e.target === dropEl){
        dropEl.classList.remove('drag-over');
      }
    });

    dropEl.addEventListener('drop', function(e){
      e.preventDefault();
      var id = draggedId;
      if(!id || !state.cards[id]){ clearMarkers(); return; }

      var targetCol = dropEl.dataset.column;
      var afterEl = getCardAfterY(dropEl, e.clientY);
      var siblingCards = Array.prototype.slice.call(dropEl.querySelectorAll('.card'));

      var card = state.cards[id];
      card.column = targetCol;

      // compute new order value based on position among current siblings (excluding dragged card itself if present)
      siblingCards = siblingCards.filter(function(c){ return c.dataset.id !== id; });

      if(siblingCards.length === 0){
        card.order = Date.now();
      } else if(!afterEl){
        var lastCard = state.cards[siblingCards[siblingCards.length - 1].dataset.id];
        card.order = lastCard.order + 1;
      } else {
        var afterCard = state.cards[afterEl.dataset.id];
        var idxInSibs = siblingCards.indexOf(afterEl);
        var beforeCard = idxInSibs > 0 ? state.cards[siblingCards[idxInSibs - 1].dataset.id] : null;
        if(beforeCard){
          card.order = (beforeCard.order + afterCard.order) / 2;
        } else {
          card.order = afterCard.order - 1;
        }
      }

      clearMarkers();
      scheduleSave();
      renderBoard();
    });
  }

  function getCardAfterY(dropEl, y){
    var cards = Array.prototype.slice.call(dropEl.querySelectorAll('.card:not(.dragging)'));
    var closest = null;
    var closestOffset = -Infinity;
    cards.forEach(function(c){
      var box = c.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if(offset < 0 && offset > closestOffset){
        closestOffset = offset;
        closest = c;
      }
    });
    return closest;
  }

  /* ---------------- Toast ---------------- */
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  /* ---------------- Header actions ---------------- */
  document.getElementById('parse-btn').addEventListener('click', function(){
    var raw = document.getElementById('raw-input').value;
    if(!raw.trim()){
      showToast('Nothing to parse');
      return;
    }
    var parsed = parseRawText(raw);
    if(parsed.length === 0){
      showToast('No tasks found (lines must start with -)');
      return;
    }
    parsed.forEach(function(c){ state.cards[c.id] = c; });
    scheduleSave();
    renderBoard();
    showToast('Parsed ' + parsed.length + ' card' + (parsed.length === 1 ? '' : 's'));
  });

  document.getElementById('reset-input-btn').addEventListener('click', function(){
    document.getElementById('raw-input').value = '';
    showToast('Input cleared');
  });

  document.getElementById('reset-board-btn').addEventListener('click', function(){
    var count = Object.keys(state.cards).length;
    if(count === 0){
      showToast('Board already empty');
      return;
    }
    var ok = window.confirm('Reset board? This permanently deletes all ' + count + ' card(s). This cannot be undone.');
    if(ok){
      state.cards = {};
      scheduleSave();
      renderBoard();
      showToast('Board reset');
    }
  });

  /* ---------------- Init ---------------- */
  loadState();
  renderBoard();
})();
</script>

</body>
</html>
