<!doctype html>
<!--
  FILE: index.html
  VERSION: v2 (previously v1 — see notes below)
  Static HTML shell Vite mounts the React app into (#root). Head contains
  favicon/home-screen-icon links, page title/description, and Google Fonts.

  ICON SET (generated from public/forge.svg via rsvg-convert, all with a
  white background + ember bolt logo per user request — previously the
  favicon had a dark background):
    forge.svg            - modern browsers' tab favicon (vector, any size)
    favicon-32x32.png     - fallback for browsers without SVG favicon support
    favicon-16x16.png     - "
    apple-touch-icon.png  - iOS "Add to Home Screen" icon (180x180, the size
                             iOS actually requests; other sizes are ignored)
    icon-192.png           - Android/Chrome "Add to Home Screen" icon
  If the logo changes again later, regenerate all of these from the new
  forge.svg with: rsvg-convert -w SIZE -h SIZE forge.svg -o OUTPUT.png
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon: SVG first (modern browsers use this and ignore the PNGs
         below), PNG fallbacks for older browsers that don't support SVG favicons. -->
    <link rel="icon" type="image/svg+xml" href="/forge.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- iOS "Add to Home Screen" icon — Safari specifically looks for
         apple-touch-icon and ignores the SVG/PNG favicons above for this purpose. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Android/Chrome "Add to Home Screen" icon. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Makes the home-screen shortcut open without Safari's browser chrome
         (address bar etc.), feeling more like an installed app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Short label under the home-screen icon — iOS truncates long titles,
         so this is deliberately shorter than the browser-tab <title> below. -->
    <meta name="apple-mobile-web-app-title" content="DayForge" />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B1D22" />

    <title>DayForge — The Daily Planning & Notetaker App</title>
    <meta name="description" content="DayForge: quickly capture tasks, drag them into a day's timeline, keep pinned reminders in view, and forecast your week — with recurring tasks and reusable routine templates." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
