<!--
  FILE: public/forge.svg
  VERSION: v2 (previously v1, background changed dark to white per user request)
  Used as the browser tab favicon (see index.html link rel=icon) and as the
  source for the rasterized PNG icons (apple touch icon, icon 192, favicon
  32/16) generated alongside it in this repo.
  NOTE: colors are hardcoded hex, not CSS custom properties, because
  favicons and home screen icons render outside the page DOM and have no
  access to the app's stylesheet variables.
-->
