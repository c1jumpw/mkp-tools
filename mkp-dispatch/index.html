<!doctype html>
<!--
  ===========================================================================
  index.html — Dispatch It app shell
  ===========================================================================
  PURPOSE
    The single page every screen renders into (#app). Loads fonts, styles
    and the app's scripts in dependency order, and registers the service
    worker (sw.js) for offline support.

  SCRIPT ORDER MATTERS (plain scripts, no bundler — each file uses the
  globals defined by the ones before it):
    config.js → storage.js → clickup.js → ui.js → routing.js → app.js

  VERSION HISTORY
    v1  2026-07-23  Initial shell.
    v2  2026-10-10  Renamed to "Dispatch It" (title, Apple home-screen
                    title). Added ui.js and routing.js, and #toast-root
                    (outside #app so screen re-renders never wipe a toast).
                    New icon set: ticket mark with a "dispatch" arrow
                    (replaces the play triangle, which read as a video
                    icon); SVG favicon + 32px PNG fallback + a proper
                    180px apple-touch-icon (was reusing the 192px file).
  ===========================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12141A">
  <title>Dispatch It</title>
  <meta name="description" content="Say it once, it lands in the right ClickUp list. Smart routing, duplicate checks and one-tap undo.">
  <meta name="apple-mobile-web-app-title" content="Dispatch It">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/clickup.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/routing.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
