# =============================================================================
# wrangler.toml — Cloudflare Worker deployment config for dispatch-clickup-proxy
# =============================================================================
# PURPOSE
#   Deployment + binding config for the proxy Worker (clickup-proxy.js).
#   Values here are either public (safe to commit) or references to
#   secrets stored separately in Cloudflare (never written to this file).
#
# VERSION HISTORY
#   v1  2026-07-23  Personal-token era. Only ALLOWED_ORIGIN as a var;
#                    CLICKUP_TOKEN set out-of-band via `wrangler secret`.
#   v2  2026-07-23  Switched to OAuth app model. Added CLICKUP_CLIENT_ID
#                    (public) and APP_URL vars, and the TOKEN_STORE KV
#                    namespace binding used to persist the OAuth access
#                    token. CLICKUP_CLIENT_SECRET set via `wrangler
#                    secret put`, same as CLICKUP_TOKEN was previously.
# =============================================================================

name = "dispatch-clickup-proxy"
main = "clickup-proxy.js"
compatibility_date = "2024-11-01"

[vars]
# The one origin allowed to call this Worker directly via fetch() from
# a browser (CORS). Must match the deployed app's origin exactly —
# protocol + domain, no path, no trailing slash.
ALLOWED_ORIGIN = "https://c1jumpw.github.io"

# Full URL (including path) of the deployed app. Used only as the
# redirect target after a successful/failed OAuth handshake — this is
# where the Worker sends the browser back to after ClickUp hands back
# control. Trailing slash is stripped automatically in code either way.
APP_URL = "https://c1jumpw.github.io/mkp-tools/mkp-dispatch/"

# ClickUp OAuth app's Client ID. This is meant to be public (comparable
# to a username) and is safe to commit — it identifies the app to
# ClickUp but grants no access on its own. Copied from ClickUp →
# Settings → Apps → ClickUp API Settings → your app.
CLICKUP_CLIENT_ID = "CB58HH6R33DAM091WKD5OG4EO5NSWP0I"

# -----------------------------------------------------------------------
# KV namespace: persists the OAuth access_token between requests (the
# Worker itself has no memory between invocations). Created once via:
#   wrangler kv namespace create TOKEN_STORE
# The id below is that namespace's permanent identifier — not a secret,
# just a storage reference (comparable to a database name).
# -----------------------------------------------------------------------
[[kv_namespaces]]
binding = "TOKEN_STORE"
id = "529827efc99e46b6aab8d32bb154edef"

# -----------------------------------------------------------------------
# Secrets (NOT stored in this file — set via terminal, held encrypted
# by Cloudflare):
#   wrangler secret put CLICKUP_CLIENT_SECRET   ← already done
#
# CLICKUP_TOKEN (from the old personal-token setup) may still exist as
# a secret on this Worker from v1 — it's unused by v2's code and safe
# to leave in place, or remove later with:
#   wrangler secret delete CLICKUP_TOKEN
# -----------------------------------------------------------------------
