<!DOCTYPE html>
<!--
  index.html (c1jumpw/mkp-tools/pdl) — forwards the old My PD address to the new one.

  PURPOSE      My PD used to be served from https://c1jumpw.github.io/mkp-tools/pdl/.
               It now lives at https://mypd.mkcworkspace.com (app files in
               c3jumpw/mkp-tools/pdl, published by Vercel). This page sends old
               bookmarks and home-screen icons there, keeping any ?query and #section.
  WHAT STAYS   The library itself (pdl/media/) stays in THIS repo. The app reads it from
               here and the pdl-relay worker writes to it here. Don't delete pdl/media.
  ASSUMPTIONS  - Only forwards when opened on c1jumpw.github.io. On any other host (for
                 example if a proxy ever serves this file) it shows the link instead, so
                 it can never loop back on itself.
               - Upload this only AFTER mypd.mkcworkspace.com is served from c3. While the
                 domain still proxied to this repo, it would have shown this page there.
               - No service worker was ever registered at the old address, so nothing
                 cached can keep serving the old app.

  VERSION HISTORY
    v1  2026-11-22  Replaces the app with a forwarding page (app moved to c3 + Vercel).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#171310">
<title>My PD has moved</title>
<link rel="canonical" href="https://mypd.mkcworkspace.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23221d18'/%3E%3Cg fill='none' stroke='%23c9a15e' stroke-width='6.5' stroke-linejoin='round' stroke-linecap='round'%3E%3Cpath d='M90 54 Q66 40 38 44 L38 124 Q66 120 90 135 Q114 120 142 124 L142 44 Q114 40 90 54 Z'/%3E%3Cpath d='M90 54 L90 133'/%3E%3C/g%3E%3C/svg%3E">
<script>
  /**
   * Sends visitors of the old address to the new one straight away, before the page
   * paints. Keeps ?query and #section so links such as #vault still land in the right
   * place. Only runs on the old host; see ASSUMPTIONS above.
   */
  (function () {
    var NEW_HOME = "https://mypd.mkcworkspace.com/";
    if (location.hostname !== "c1jumpw.github.io") return;
    location.replace(NEW_HOME + location.search + location.hash);
  })();
</script>
<style>
  :root { --bg:#171310; --card:#221d18; --line:#3a3127; --ink:#f3ece2; --muted:#b5a896; --gold:#c9a15e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 380px; text-align: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 32px 24px;
  }
  svg { width: 72px; height: 72px; }
  h1 { font-size: 22px; margin: 16px 0 6px; }
  p { color: var(--muted); margin: 0 0 22px; }
  a.btn {
    display: block; padding: 14px; border-radius: 12px; text-decoration: none; font-weight: 600;
    background: var(--gold); color: #1b1611;
  }
  .addr { margin-top: 14px; font-size: 13px; color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
  <main class="card">
    <svg viewBox="0 0 180 180" aria-hidden="true">
      <rect width="180" height="180" rx="40" fill="#221d18"/>
      <rect x="1" y="1" width="178" height="178" rx="39" fill="none" stroke="#3a3127" stroke-width="2"/>
      <g fill="none" stroke="#c9a15e" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round">
        <path d="M90 54 Q66 40 38 44 L38 124 Q66 120 90 135 Q114 120 142 124 L142 44 Q114 40 90 54 Z"/>
        <path d="M90 54 L90 133"/>
      </g>
    </svg>
    <h1>My PD has moved</h1>
    <p>Same library, new address. Update your bookmark or home-screen icon.</p>
    <a class="btn" id="go" href="https://mypd.mkcworkspace.com/">Open My PD</a>
    <div class="addr">mypd.mkcworkspace.com</div>
  </main>
  <script>
    // Keep ?query and #section on the button too, for anyone who lands here without
    // the automatic forward (for example a host other than c1jumpw.github.io).
    document.getElementById("go").href = "https://mypd.mkcworkspace.com/" + location.search + location.hash;
  </script>
</body>
</html>
